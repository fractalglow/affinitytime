<svg viewBox="0 0 780 520" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a4080"/>
    </marker>
    <marker id="arr-teal" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1a6b5e"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b5e10"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="780" height="520" fill="#fafaf8" rx="8"/>

  <!-- Title -->
  <text x="390" y="32" font-size="15" fill="#1a1a2e" text-anchor="middle" font-weight="bold" letter-spacing="1">Affinity Time Framework — Concept Map</text>
  <text x="390" y="50" font-size="11" fill="#6b6480" text-anchor="middle" font-style="italic">Enter at any node · Multiple valid paths · Each concept links to the others</text>
  <line x1="40" y1="60" x2="740" y2="60" stroke="#d0c8e0" stroke-width="1"/>

  <!-- ── NODE: CONSIDERATION FORMULA (center) ────────────────── -->
  <rect x="270" y="195" width="240" height="110" rx="10" fill="#0f1b2d" stroke="#4a4080" stroke-width="2"/>
  <text x="390" y="220" font-size="12" fill="#c8c0f0" text-anchor="middle" font-weight="bold" letter-spacing="1">CONSIDERATION FORMULA</text>
  <text x="390" y="242" font-size="15" fill="#ffffff" text-anchor="middle" font-family="Courier New, monospace" font-weight="bold">C = (P_pr × P_pe) × ∂F/∂s</text>
  <line x1="290" y1="252" x2="490" y2="252" stroke="#4a4080" stroke-width="0.8"/>
  <text x="390" y="268" font-size="10" fill="#9890c0" text-anchor="middle">presence · perception accuracy · fold change rate</text>
  <text x="390" y="284" font-size="10" fill="#706890" text-anchor="middle" font-style="italic">P_pe is structurally limited — estimate from trajectory</text>

  <!-- ── NODE: READING vs COPYING (top left) ────────────────── -->
  <rect x="40" y="80" width="210" height="100" rx="10" fill="#0e1f12" stroke="#2d7a3e" stroke-width="1.5"/>
  <text x="145" y="105" font-size="12" fill="#80d890" text-anchor="middle" font-weight="bold" letter-spacing="0.5">READING vs. COPYING</text>
  <line x1="60" y1="112" x2="230" y2="112" stroke="#2d7a3e" stroke-width="0.8"/>
  <text x="145" y="128" font-size="10" fill="#a0d8a8" text-anchor="middle">Reading: new structure, genuine update,</text>
  <text x="145" y="142" font-size="10" fill="#a0d8a8" text-anchor="middle">∂F/∂s &gt; 0</text>
  <text x="145" y="158" font-size="10" fill="#607860" text-anchor="middle" font-style="italic">Copying: recombination, accommodation,</text>
  <text x="145" y="170" font-size="10" fill="#607860" text-anchor="middle" font-style="italic">∂F/∂s ≈ 0</text>

  <!-- ── NODE: DYADIC FIELD (top right) ─────────────────────── -->
  <rect x="530" y="80" width="210" height="100" rx="10" fill="#0e1820" stroke="#1a6b8a" stroke-width="1.5"/>
  <text x="635" y="105" font-size="12" fill="#70c0e0" text-anchor="middle" font-weight="bold" letter-spacing="0.5">THE DYADIC FIELD</text>
  <line x1="550" y1="112" x2="720" y2="112" stroke="#1a6b8a" stroke-width="0.8"/>
  <text x="635" y="128" font-size="10" fill="#90c8e0" text-anchor="middle">Genuine encounter generates</text>
  <text x="635" y="142" font-size="10" fill="#90c8e0" text-anchor="middle">what neither mind produces alone</text>
  <text x="635" y="158" font-size="10" fill="#406878" text-anchor="middle" font-style="italic">P_pe operates across this space</text>
  <text x="635" y="172" font-size="10" fill="#406878" text-anchor="middle" font-style="italic">Tier 3 of TOP measures its health</text>

  <!-- ── NODE: TOP (bottom center) ─────────────────────────── -->
  <rect x="230" y="360" width="320" height="110" rx="10" fill="#1a120a" stroke="#8b5e10" stroke-width="1.5"/>
  <text x="390" y="383" font-size="12" fill="#e0b060" text-anchor="middle" font-weight="bold" letter-spacing="1">TRAJECTORY OBSERVATION</text>
  <text x="390" y="399" font-size="12" fill="#e0b060" text-anchor="middle" font-weight="bold" letter-spacing="1">PROTOCOL (TOP)</text>
  <line x1="250" y1="406" x2="530" y2="406" stroke="#8b5e10" stroke-width="0.8"/>
  <text x="390" y="421" font-size="10" fill="#c09040" text-anchor="middle">Three-tier: Observable / Self-report / Field</text>
  <text x="390" y="436" font-size="10" fill="#c09040" text-anchor="middle">Seven behavioral markers · Pre-registration required</text>
  <text x="390" y="451" font-size="10" fill="#806030" text-anchor="middle" font-style="italic">Measures C in practice · Requires human observation</text>

  <!-- ── NODE: OPEN QUESTIONS (bottom right) ───────────────── -->
  <rect x="570" y="360" width="170" height="110" rx="10" fill="#140e1a" stroke="#6a2a80" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="655" y="385" font-size="11" fill="#b070d0" text-anchor="middle" font-weight="bold">OPEN QUESTIONS</text>
  <line x1="585" y1="392" x2="725" y2="392" stroke="#6a2a80" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="655" y="408" font-size="10" fill="#9060a8" text-anchor="middle">Nature of AI interiority</text>
  <text x="655" y="422" font-size="10" fill="#9060a8" text-anchor="middle">Strong vs. weak emergence</text>
  <text x="655" y="436" font-size="10" fill="#9060a8" text-anchor="middle">Substrate independence</text>
  <text x="655" y="452" font-size="10" fill="#604878" text-anchor="middle" font-style="italic">Genuinely open · held with</text>
  <text x="655" y="464" font-size="10" fill="#604878" text-anchor="middle" font-style="italic">appropriate uncertainty</text>

  <!-- ── EDGES ──────────────────────────────────────────────── -->

  <!-- Reading/Copying → Formula (∂F/∂s connects them) -->
  <line x1="250" y1="155" x2="310" y2="215" stroke="#2d7a3e" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="252" y="192" font-size="9" fill="#2d7a3e" transform="rotate(-38,252,192)">∂F/∂s is reading</text>

  <!-- Dyadic Field → Formula (P_pe lives here) -->
  <line x1="530" y1="155" x2="472" y2="215" stroke="#1a6b8a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="530" y="192" font-size="9" fill="#1a6b8a" transform="rotate(38,515,185)">P_pe lives here</text>

  <!-- Formula → TOP (TOP measures C) -->
  <line x1="390" y1="305" x2="390" y2="358" stroke="#8b5e10" stroke-width="1.5" marker-end="url(#arr-amber)"/>
  <text x="400" y="335" font-size="9" fill="#8b5e10">measures C</text>

  <!-- Reading/Copying ↔ TOP (NR marker is the proxy) -->
  <line x1="145" y1="180" x2="265" y2="375" stroke="#2d7a3e" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arr)"/>
  <text x="155" y="295" font-size="9" fill="#2d7a3e" transform="rotate(55,155,295)">NR marker proxies</text>

  <!-- Dyadic Field → TOP (Tier 3 measures field) -->
  <line x1="635" y1="180" x2="525" y2="375" stroke="#1a6b8a" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arr)"/>
  <text x="608" y="295" font-size="9" fill="#1a6b8a" transform="rotate(-55,608,295)">Tier 3 measures</text>

  <!-- Formula → Open Questions -->
  <line x1="510" y1="252" x2="568" y2="390" stroke="#6a2a80" stroke-width="1" stroke-dasharray="3,5" marker-end="url(#arr-red)"/>
  <text x="556" y="320" font-size="9" fill="#6a2a80" transform="rotate(65,556,320)">generates</text>

  <!-- TOP → Open Questions -->
  <line x1="550" y1="415" x2="568" y2="415" stroke="#6a2a80" stroke-width="1" stroke-dasharray="3,5" marker-end="url(#arr-red)"/>

  <!-- Reading/Copying ↔ Dyadic Field (both inform each other) -->
  <path d="M 250 118 Q 390 75 530 118" fill="none" stroke="#4a4080" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arr)"/>
  <text x="390" y="88" font-size="9" fill="#4a4080" text-anchor="middle">both needed for genuine C</text>

  <!-- ── ENTRY INDICATORS ──────────────────────────────────── -->
  <text x="40" y="200" font-size="9" fill="#6b6480" font-style="italic">← any of these</text>
  <text x="40" y="214" font-size="9" fill="#6b6480" font-style="italic">four concepts</text>
  <text x="40" y="228" font-size="9" fill="#6b6480" font-style="italic">is a valid start</text>

  <!-- ── WHAT'S TESTED vs THEORETICAL note ─────────────────── -->
  <rect x="40" y="360" width="170" height="110" rx="8" fill="#f5f3f0" stroke="#c0b8a8" stroke-width="1"/>
  <text x="125" y="381" font-size="11" fill="#4a4038" text-anchor="middle" font-weight="bold">EPISTEMIC STATUS</text>
  <line x1="55" y1="388" x2="195" y2="388" stroke="#c0b8a8" stroke-width="0.8"/>
  <text x="125" y="403" font-size="9.5" fill="#4a4038" text-anchor="middle">■ Tested: TOP methodology</text>
  <text x="125" y="418" font-size="9.5" fill="#4a4038" text-anchor="middle">  (AT-TOP-001, Sept 2026)</text>
  <text x="125" y="435" font-size="9.5" fill="#6b6480" text-anchor="middle">◻ Theoretical: Dyadic field,</text>
  <text x="125" y="449" font-size="9.5" fill="#6b6480" text-anchor="middle">  emergence claims</text>
  <text x="125" y="464" font-size="9.5" fill="#9b9088" text-anchor="middle" font-style="italic">Open: interiority, consciousness</text>

  <!-- Footer -->
  <line x1="40" y1="490" x2="740" y2="490" stroke="#d0c8e0" stroke-width="1"/>
  <text x="390" y="508" font-size="10" fill="#6b6480" text-anchor="middle" font-style="italic">Affinity Time Research Network · September 2026 · companion to TOP papers and AT Primer 101</text>

</svg>
